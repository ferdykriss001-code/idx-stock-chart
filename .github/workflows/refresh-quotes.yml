name: Active 100 - Yahoo via VPS proxy

on:
  workflow_dispatch:
  schedule:
    # Every 15 minutes on weekdays during/around IDX trading hours.
    - cron: "*/15 1-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: active100-vps-proxy-quotes
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MARKET_PROXY_URL: ${{ secrets.MARKET_PROXY_URL }}
      MARKET_PROXY_TOKEN: ${{ secrets.MARKET_PROXY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require private proxy configuration
        run: |
          test -n "$MARKET_PROXY_URL" || (echo "Missing GitHub secret MARKET_PROXY_URL" && exit 1)
          test -n "$MARKET_PROXY_TOKEN" || (echo "Missing GitHub secret MARKET_PROXY_TOKEN" && exit 1)

      - name: Fetch Active 100 through VPS Yahoo proxy
        run: python -u scripts/update_quotes_from_proxy.py

      - name: Validate fresh quote book
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/quotes.json', encoding='utf-8'))
          r=d.get('refresh') or {}
          print('Refresh:', r)
          if int(r.get('successCount') or 0) < 1:
              raise SystemExit('Proxy returned no fresh tickers')
          for symbol in ('DSSA','BKSL','KETR','BUMI'):
              q=(d.get('quotes') or {}).get(symbol)
              print(symbol, q.get('day') if q else 'missing', q.get('close') if q else '')
          PY

      - name: Commit fresh quotes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          if git diff --cached --quiet; then
            echo "No quote changes to commit."
            exit 0
          fi
          git commit -m "data(active100): refresh Yahoo quotes via VPS"
          git pull --rebase origin main
          git push origin main
