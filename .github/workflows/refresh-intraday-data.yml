name: Refresh IDX intraday prices

on:
  workflow_dispatch:
  schedule:
    # Setiap 10 menit, Senin–Jumat. Target keterlambatan umumnya di bawah 15 menit.
    - cron: "*/10 1-10 * * 1-5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-intraday-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-idx-intraday-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download 5-minute candles
        env:
          TICKERS: BBCA DCII BREN BBRI BYAN BMRI MORA TLKM AMMN ASII DSSA TPIA SMMA DNET SRAJ BRPT BBNI PANI CASA MPRO UNTR EMAS BNLI ICBP HMSP BRIS IMPC CDIA UNVR BRMS ADRO ANTM AADI CUAN MDKA INDF GOTO AMRT ISAT CPIN ADMR MBMA SUPR NCKL BUMI MEGA MTEL INCO EXCL MYOR BKSL KETR PTBA NETV PTRO ITMG
        run: |
          python3 - <<'PY'
          import json
          import math
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          out = Path("data/intraday")
          out.mkdir(parents=True, exist_ok=True)
          jakarta = ZoneInfo("Asia/Jakarta")
          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; IDX-Chart-Lab/1.1)",
              "Accept": "application/json,text/plain,*/*",
          }

          def download(symbol):
              last_error = None
              for host in ("query1.finance.yahoo.com", "query2.finance.yahoo.com"):
                  url = f"https://{host}/v8/finance/chart/{symbol}.JK?range=5d&interval=5m&events=history&includePrePost=false"
                  try:
                      request = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(request, timeout=30) as response:
                          payload = json.load(response)
                      chart = payload.get("chart", {})
                      if chart.get("error"):
                          raise RuntimeError(chart["error"])
                      results = chart.get("result") or []
                      if not results:
                          raise ValueError("Yahoo returned no result")
                      result = results[0]
                      quote = result["indicators"]["quote"][0]
                      bars = []
                      for index, stamp in enumerate(result.get("timestamp") or []):
                          values = []
                          for key in ("open", "high", "low", "close"):
                              series = quote.get(key) or []
                              values.append(series[index] if index < len(series) else None)
                          if not all(isinstance(value, (int, float)) and math.isfinite(value) for value in values):
                              continue
                          volumes = quote.get("volume") or []
                          volume = volumes[index] if index < len(volumes) else 0
                          local_dt = datetime.fromtimestamp(stamp, timezone.utc).astimezone(jakarta)
                          bars.append({
                              "time": stamp,
                              "day": local_dt.strftime("%Y-%m-%d"),
                              "dateTime": local_dt.isoformat(),
                              "open": values[0], "high": values[1], "low": values[2], "close": values[3],
                              "volume": volume if isinstance(volume, (int, float)) and math.isfinite(volume) else 0,
                          })
                      if not bars:
                          raise ValueError("No valid intraday candles")
                      meta = result.get("meta", {})
                      return {
                          "symbol": symbol,
                          "source": "Yahoo Finance 5m",
                          "interval": "5m",
                          "updatedAt": int(time.time()),
                          "latestCandleTime": bars[-1]["time"],
                          "latestPrice": bars[-1]["close"],
                          "meta": {
                              "longName": meta.get("longName") or meta.get("shortName") or f"{symbol} • IDX",
                              "exchangeName": meta.get("fullExchangeName") or "IDX",
                              "regularMarketTime": meta.get("regularMarketTime"),
                              "regularMarketPrice": meta.get("regularMarketPrice"),
                          },
                          "bars": bars,
                      }
                  except Exception as error:
                      last_error = error
                      print(f"{symbol}: {host} failed: {error}")
                      time.sleep(1)
              raise RuntimeError(last_error)

          saved = 0
          for ticker in os.environ["TICKERS"].split():
              try:
                  record = download(ticker)
                  (out / f"{ticker}.json").write_text(json.dumps(record, separators=(",", ":")), encoding="utf-8")
                  saved += 1
                  print(f"Saved {ticker}: {len(record['bars'])} candles; latest={record['latestPrice']}")
              except Exception as error:
                  print(f"Skipping {ticker}: {error}")
          if not saved:
              raise SystemExit("No intraday market data refreshed.")
          PY

      - name: Commit intraday data when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intraday
          if git diff --cached --quiet; then
            echo "No intraday changes to commit."
          else
            git commit -m "chore: refresh IDX intraday prices"
            git pull --rebase origin main
            git push
          fi
