name: Active 100 - Yahoo quotes

on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes on weekdays during/around IDX trading hours.
    # Lower frequency reduces Yahoo 429 rate limiting on GitHub datacenter IPs.
    - cron: "0,30 1-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: active100-yahoo-quotes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch active 100 from Yahoo in two batches
        run: python -u scripts/update_active100_quotes.py

      - name: Validate generated quote book
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/quotes.json', encoding='utf-8'))
          r=d.get('refresh') or {}
          print('Refresh:', r)
          if int(r.get('successCount') or 0) < 1:
              raise SystemExit('No ticker was refreshed')
          for symbol in ('DSSA','BKSL','KETR','BUMI'):
              q=(d.get('quotes') or {}).get(symbol)
              print(symbol, q.get('day') if q else 'missing', q.get('close') if q else '')
          PY

      - name: Commit fresh quotes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          if git diff --cached --quiet; then
            echo "No quote changes to commit."
            exit 0
          fi
          git commit -m "data(active100): refresh Yahoo quotes"
          git pull --rebase origin main
          git push origin main
