name: Apply live quotes fallback once

on:
  push:
    paths:
      - '.github/workflows/apply-live-quotes-fallback.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch index.html to use freshest quote source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''        try {
          var quoteBook = await fetchJsonNoCache("data/quotes.json");
          var quote = quoteBook && quoteBook.quotes ? quoteBook.quotes[symbol] : null;
          if (quote) {
            bars = mergeQuoteIntoDaily(bars, quote);
            intradayUpdatedAt = quote.updatedAt || quoteBook.updatedAt || null;
            latestPrice = Number(quote.close);
          }
        } catch (quoteError) {}'''
          new = '''        try {
          var quoteBook = null;
          var localQuoteBook = null;
          var rawQuoteBook = null;
          try {
            localQuoteBook = await fetchJsonNoCache("data/quotes.json");
          } catch (localQuoteError) {}

          var localUpdated = localQuoteBook ? Number(localQuoteBook.updatedAt || 0) : 0;
          var localAge = localUpdated ? Math.floor(Date.now() / 1000) - localUpdated : Infinity;

          // GitHub Pages can lag behind main when a Pages deployment is queued or fails.
          // If the Pages copy is older than 12 minutes, read quotes.json directly from main.
          if (!localQuoteBook || localAge > 720) {
            try {
              var rawUrl = "https://raw.githubusercontent.com/ferdykriss001-code/idx-stock-chart/main/data/quotes.json?ts=" + Date.now();
              var rawResponse = await fetch(rawUrl, { cache: "no-store", mode: "cors" });
              if (rawResponse.ok) rawQuoteBook = await rawResponse.json();
            } catch (rawQuoteError) {}
          }

          if (rawQuoteBook && Number(rawQuoteBook.updatedAt || 0) > localUpdated) {
            quoteBook = rawQuoteBook;
          } else {
            quoteBook = localQuoteBook || rawQuoteBook;
          }

          var quote = quoteBook && quoteBook.quotes ? quoteBook.quotes[symbol] : null;
          if (quote) {
            bars = mergeQuoteIntoDaily(bars, quote);
            intradayUpdatedAt = quote.updatedAt || quoteBook.updatedAt || null;
            latestPrice = Number(quote.close);
          }
        } catch (quoteError) {}'''
          if 'raw.githubusercontent.com/ferdykriss001-code/idx-stock-chart/main/data/quotes.json' in s:
              print('Fallback already present; no index patch needed.')
          elif old not in s:
              raise SystemExit('Expected quote loader block not found; refusing unsafe patch.')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
              print('Patched index.html with live raw fallback.')
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/apply-live-quotes-fallback.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-live-quotes-fallback.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "fix(frontend): use fresh quotes directly from main when Pages is stale"
          git pull --rebase origin main
          git push
