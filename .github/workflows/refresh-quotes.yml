name: Active 100 - Yahoo 5-minute quotes

on:
  workflow_dispatch:
  schedule:
    # Every 10 minutes, weekdays. UTC 01:00-10:59 covers the IDX session + margin.
    - cron: "*/10 1-10 * * 1-5"
  push:
    branches: [main]
    paths:
      - "scripts/update_active100_quotes.py"
      - "config/tickers.json"
      - ".github/workflows/refresh-quotes.yml"

permissions:
  contents: write

concurrency:
  group: active100-yahoo-quotes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch 100 active IDX tickers from Yahoo
        run: python scripts/update_active100_quotes.py

      - name: Validate DSSA and refresh result
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          d=json.load(open('data/quotes.json', encoding='utf-8'))
          r=d.get('refresh') or {}
          print('Refresh:', r)
          q=(d.get('quotes') or {}).get('DSSA')
          if not q:
              raise SystemExit('DSSA missing from quotes.json')
          print('DSSA:', q.get('day'), q.get('close'), q.get('latestCandleTime'))
          print('Generated:', datetime.fromtimestamp(d['updatedAt'], ZoneInfo('Asia/Jakarta')).isoformat())
          if int(r.get('successCount') or 0) < 50:
              raise SystemExit('Too few successful tickers')
          PY

      - name: Commit fresh quotes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          if git diff --cached --quiet; then
            echo "No quote changes to commit."
            exit 0
          fi
          git commit -m "data(active100): refresh Yahoo 5-minute quotes"
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
