name: V2 Verify IDX intraday freshness

on:
  workflow_dispatch:
  schedule:
    # Every 10 minutes during the possible regular-session window (UTC).
    # The checker skips lunch, post-close, weekends, and waits 15 minutes after
    # each session opens before enforcing the 10-minute target.
    - cron: "4,14,24,34,44,54 2-9 * * 1-5"

permissions:
  contents: read

concurrency:
  group: v2-verify-idx-intraday-freshness
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce 10-minute intraday freshness target
        run: python scripts/check_intraday_freshness.py --max-delay-minutes 10
