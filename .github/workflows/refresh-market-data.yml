name: Refresh IDX daily candles

on:
  workflow_dispatch:
  schedule:
    - cron: "30 11 * * 1-5"
    - cron: "30 14 * * 1-5"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/update_market.py"
      - "top50-market-cap-jun-2026.csv"
      - ".github/workflows/refresh-market-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-idx-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install market-data dependencies
        run: python -m pip install --upgrade "yfinance>=0.2.54" "pandas>=2.2"

      - name: Download daily candles for 50 market-cap stocks and additions
        run: python scripts/update_market.py --mode daily

      - name: Commit refreshed daily data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No daily changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh IDX daily candles"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 6))
          done
          exit 1
