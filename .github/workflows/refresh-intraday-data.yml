name: Legacy V3 - Refresh IDX 5-minute market.json (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-v3-market-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh legacy 5-minute candles into market.json
        run: python scripts/update_market_v3.py --mode intraday --workers 6
      - name: Commit legacy market.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then
            echo "No legacy intraday changes."
            exit 0
          fi
          git commit -m "chore(legacy-v3): refresh market.json manually"
          git pull --rebase origin main
          git push
