name: Active 100 - Refresh 5-minute Yahoo quotes

on:
  workflow_dispatch:
  schedule:
    # Every 10 minutes during broad IDX trading hours on weekdays.
    # GitHub scheduler may queue a run; only 100 active tickers are processed.
    - cron: "*/10 1-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: active-100-quotes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh active-100 shard ${{ matrix.shard }}
        run: |
          mkdir -p build/quotes
          python scripts/update_quotes_full.py \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4 \
            --batch-size 25 \
            --fallback-limit 5 \
            --out build/quotes/quotes-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: active100-quotes-${{ matrix.shard }}
          path: build/quotes/quotes-shard-${{ matrix.shard }}.json
          retention-days: 1

  merge:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: active100-quotes-*
          path: build/quotes
          merge-multiple: true
      - name: Merge fresh quotes
        run: python scripts/merge_quote_shards.py --input-dir build/quotes
      - name: Commit quotes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          if git diff --cached --quiet; then
            echo "No quote changes."
            exit 0
          fi
          git commit -m "chore(active100): refresh Yahoo 5-minute quotes"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 4))
          done
          exit 1
