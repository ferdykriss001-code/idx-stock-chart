name: Refresh IDX daily candles

on:
  workflow_dispatch:
  schedule:
    # 17:30 WIB on business days. GitHub may delay scheduled jobs slightly.
    - cron: "30 10 * * 1-5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-market-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-idx-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download daily candles
        env:
          TICKERS: BKSL KETR DSSA PTBA BREN NETV BBCA BBRI BMRI TLKM
        run: |
          python3 - <<'PY'
          import json
          import math
          import os
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          out = Path("data")
          out.mkdir(exist_ok=True)
          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; IDX-Chart-Lab/1.0)",
              "Accept": "application/json,text/plain,*/*",
          }

          def download(symbol):
              last_error = None
              for host in ("query1.finance.yahoo.com", "query2.finance.yahoo.com"):
                  url = f"https://{host}/v8/finance/chart/{symbol}.JK?range=2y&interval=1d&events=history&includeAdjustedClose=true"
                  try:
                      request = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(request, timeout=30) as response:
                          payload = json.load(response)
                      result = payload["chart"]["result"][0]
                      quote = result["indicators"]["quote"][0]
                      bars = []
                      for index, stamp in enumerate(result.get("timestamp", [])):
                          values = [quote.get(key, [None])[index] for key in ("open", "high", "low", "close")]
                          if not all(isinstance(value, (int, float)) and math.isfinite(value) for value in values):
                              continue
                          volume = quote.get("volume", [0])[index]
                          bars.append({
                              "time": datetime.fromtimestamp(stamp, timezone.utc).strftime("%Y-%m-%d"),
                              "timestamp": stamp,
                              "open": values[0], "high": values[1], "low": values[2], "close": values[3],
                              "volume": volume if isinstance(volume, (int, float)) and math.isfinite(volume) else 0,
                          })
                      if len(bars) < 80:
                          raise ValueError("not enough daily candles")
                      meta = result.get("meta", {})
                      return {
                          "symbol": symbol,
                          "updatedAt": int(time.time()),
                          "source": "Yahoo Finance",
                          "meta": {
                              "longName": meta.get("longName") or meta.get("shortName") or f"{symbol} • IDX",
                              "exchangeName": meta.get("fullExchangeName") or "IDX",
                              "regularMarketTime": meta.get("regularMarketTime"),
                          },
                          "bars": bars,
                      }
                  except Exception as error:
                      last_error = error
                      print(f"{symbol}: {host} failed: {error}")
                      time.sleep(2)
              raise RuntimeError(last_error)

          saved = 0
          for ticker in os.environ["TICKERS"].split():
              try:
                  record = download(ticker)
                  (out / f"{ticker}.json").write_text(json.dumps(record, separators=(",", ":")), encoding="utf-8")
                  saved += 1
                  print(f"Saved {ticker}: {len(record['bars'])} candles")
              except Exception as error:
                  print(f"Skipping {ticker}: {error}")
          if not saved:
              raise SystemExit("No market data could be refreshed.")
          PY

      - name: Commit refreshed data when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh IDX daily candles"
            git push
          fi
