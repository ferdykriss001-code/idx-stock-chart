name: Refresh IDX daily + intraday data

on:
  workflow_dispatch:
  schedule:
    # 18:30 dan 21:30 WIB pada hari kerja untuk finalisasi candle harian.
    - cron: "30 11 * * 1-5"
    - cron: "30 14 * * 1-5"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "top50-market-cap-jun-2026.csv"
      - ".github/workflows/refresh-market-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-idx-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download daily and 5-minute candles
        env:
          TICKERS: BBCA DCII BREN BBRI BYAN BMRI MORA TLKM AMMN ASII DSSA TPIA SMMA DNET SRAJ BRPT BBNI PANI CASA MPRO UNTR EMAS BNLI ICBP HMSP BRIS IMPC CDIA UNVR BRMS ADRO ANTM AADI CUAN MDKA INDF GOTO AMRT ISAT CPIN ADMR MBMA SUPR NCKL BUMI MEGA MTEL INCO EXCL MYOR BKSL KETR PTBA NETV PTRO ITMG
        run: |
          python3 - <<'PY'
          import json, math, os, random, time, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tickers = os.environ["TICKERS"].split()
          daily_out = Path("data")
          intra_out = Path("data/intraday")
          daily_out.mkdir(parents=True, exist_ok=True)
          intra_out.mkdir(parents=True, exist_ok=True)
          jakarta = ZoneInfo("Asia/Jakarta")
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36",
              "Accept": "application/json,text/plain,*/*",
          }

          def yahoo(symbol, interval, range_):
              errors = []
              for attempt in range(3):
                  hosts = ["query1.finance.yahoo.com", "query2.finance.yahoo.com"]
                  random.shuffle(hosts)
                  for host in hosts:
                      url = (f"https://{host}/v8/finance/chart/{symbol}.JK"
                             f"?range={range_}&interval={interval}&events=history"
                             "&includeAdjustedClose=true&includePrePost=false")
                      try:
                          req = urllib.request.Request(url, headers=headers)
                          with urllib.request.urlopen(req, timeout=35) as response:
                              payload = json.load(response)
                          chart = payload.get("chart") or {}
                          if chart.get("error"):
                              raise RuntimeError(chart["error"])
                          results = chart.get("result") or []
                          if not results:
                              raise ValueError("Yahoo returned no result")
                          return results[0]
                      except Exception as exc:
                          errors.append(f"{host}: {exc}")
                  time.sleep(2 ** attempt)
              raise RuntimeError(" | ".join(errors[-4:]))

          def finite(v):
              return isinstance(v, (int, float)) and math.isfinite(v)

          def make_daily(symbol):
              result = yahoo(symbol, "1d", "2y")
              quote = result["indicators"]["quote"][0]
              bars = []
              stamps = result.get("timestamp") or []
              for i, stamp in enumerate(stamps):
                  vals = []
                  for key in ("open", "high", "low", "close"):
                      series = quote.get(key) or []
                      vals.append(series[i] if i < len(series) else None)
                  if not all(finite(v) for v in vals):
                      continue
                  volumes = quote.get("volume") or []
                  volume = volumes[i] if i < len(volumes) else 0
                  bars.append({
                      "time": datetime.fromtimestamp(stamp, timezone.utc).strftime("%Y-%m-%d"),
                      "timestamp": stamp,
                      "open": vals[0], "high": vals[1], "low": vals[2], "close": vals[3],
                      "volume": volume if finite(volume) else 0,
                  })
              if len(bars) < 5:
                  raise ValueError(f"only {len(bars)} valid daily candles")
              meta = result.get("meta") or {}
              return {
                  "symbol": symbol, "updatedAt": int(time.time()),
                  "latestCandle": bars[-1]["time"], "source": "Yahoo Finance",
                  "meta": {
                      "longName": meta.get("longName") or meta.get("shortName") or f"{symbol} • IDX",
                      "exchangeName": meta.get("fullExchangeName") or "IDX",
                      "regularMarketTime": meta.get("regularMarketTime"),
                      "regularMarketPrice": meta.get("regularMarketPrice"),
                  },
                  "bars": bars,
              }

          def make_intraday(symbol):
              result = yahoo(symbol, "5m", "5d")
              quote = result["indicators"]["quote"][0]
              bars = []
              for i, stamp in enumerate(result.get("timestamp") or []):
                  vals = []
                  for key in ("open", "high", "low", "close"):
                      series = quote.get(key) or []
                      vals.append(series[i] if i < len(series) else None)
                  if not all(finite(v) for v in vals):
                      continue
                  volumes = quote.get("volume") or []
                  volume = volumes[i] if i < len(volumes) else 0
                  local_dt = datetime.fromtimestamp(stamp, timezone.utc).astimezone(jakarta)
                  bars.append({
                      "time": stamp, "day": local_dt.strftime("%Y-%m-%d"),
                      "dateTime": local_dt.isoformat(),
                      "open": vals[0], "high": vals[1], "low": vals[2], "close": vals[3],
                      "volume": volume if finite(volume) else 0,
                  })
              if not bars:
                  raise ValueError("no valid intraday candles")
              meta = result.get("meta") or {}
              return {
                  "symbol": symbol, "source": "Yahoo Finance 5m", "interval": "5m",
                  "updatedAt": int(time.time()), "latestCandleTime": bars[-1]["time"],
                  "latestPrice": bars[-1]["close"],
                  "meta": {
                      "longName": meta.get("longName") or meta.get("shortName") or f"{symbol} • IDX",
                      "exchangeName": meta.get("fullExchangeName") or "IDX",
                      "regularMarketTime": meta.get("regularMarketTime"),
                      "regularMarketPrice": meta.get("regularMarketPrice"),
                  },
                  "bars": bars,
              }

          def process(symbol):
              status = {"symbol": symbol, "daily": False, "intraday": False, "errors": []}
              try:
                  daily = make_daily(symbol)
                  (daily_out / f"{symbol}.json").write_text(json.dumps(daily, separators=(",", ":")), encoding="utf-8")
                  status["daily"] = True
                  status["latestDaily"] = daily["latestCandle"]
              except Exception as exc:
                  status["errors"].append("daily: " + str(exc))
              try:
                  intra = make_intraday(symbol)
                  (intra_out / f"{symbol}.json").write_text(json.dumps(intra, separators=(",", ":")), encoding="utf-8")
                  status["intraday"] = True
                  status["latestPrice"] = intra["latestPrice"]
              except Exception as exc:
                  status["errors"].append("intraday: " + str(exc))
              return status

          results = []
          with ThreadPoolExecutor(max_workers=6) as pool:
              futures = {pool.submit(process, ticker): ticker for ticker in tickers}
              for future in as_completed(futures):
                  row = future.result()
                  results.append(row)
                  print(json.dumps(row, ensure_ascii=False))

          results.sort(key=lambda row: tickers.index(row["symbol"]))
          status = {
              "updatedAt": int(time.time()), "tickerCount": len(tickers),
              "dailySuccess": sum(1 for r in results if r["daily"]),
              "intradaySuccess": sum(1 for r in results if r["intraday"]),
              "results": results,
          }
          (daily_out / "refresh-status.json").write_text(json.dumps(status, separators=(",", ":")), encoding="utf-8")
          if status["dailySuccess"] == 0:
              raise SystemExit("No daily market data could be refreshed")
          PY

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh IDX daily and intraday data"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          echo "Failed to push after three attempts."
          exit 1
