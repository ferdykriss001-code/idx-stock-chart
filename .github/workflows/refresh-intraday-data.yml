name: V2 Refresh IDX 5-minute data

on:
  workflow_dispatch:
  schedule:
    # Every 5 minutes, Monday-Friday. GitHub may still queue scheduled runs.
    - cron: "*/5 1-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: v2-refresh-idx-intraday
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh 5-minute candles in parallel
        run: python scripts/update_market.py --mode intraday --workers 10
      - name: Commit only valid refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intraday data/refresh-status-intraday.json
          if git diff --cached --quiet; then
            echo "No intraday changes."
          else
            git commit -m "chore(v2): refresh IDX 5-minute candles"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              git rebase --abort || true
              sleep $((attempt * 5))
            done
            exit 1
          fi
