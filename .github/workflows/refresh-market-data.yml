name: V2 Refresh IDX daily data

on:
  workflow_dispatch:
  schedule:
    # 19:30 and 22:30 WIB on weekdays, allowing Yahoo time to finalize IDX daily candles.
    - cron: "30 12,15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: v2-refresh-idx-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize IDX universe before daily refresh
        run: python scripts/sync_idx_universe.py --if-stale-hours 18
      - name: Refresh daily candles in parallel
        run: python scripts/update_market.py --mode daily --workers 12
      - name: Commit only valid refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/idx-universe.json data/*.json
          if git diff --cached --quiet; then
            echo "No daily changes."
          else
            git commit -m "chore(v2): refresh IDX daily candles"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              git rebase --abort || true
              sleep $((attempt * 5))
            done
            exit 1
          fi
