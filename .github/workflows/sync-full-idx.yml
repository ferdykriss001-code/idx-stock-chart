name: V3 Full IDX - Sync ticker universe

on:
  workflow_dispatch:
  schedule:
    # Once daily, 07:10 WIB
    - cron: "10 0 * * *"

permissions:
  contents: write

concurrency:
  group: full-idx-universe-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser scraper
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium
      - name: Sync official IDX listed companies
        run: python scripts/sync_idx_tickers.py
      - name: Commit ticker universe if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/tickers.json
          if git diff --cached --quiet; then
            echo "Ticker universe unchanged."
            exit 0
          fi
          git commit -m "chore(full-idx): sync official IDX ticker universe"
          git pull --rebase origin main
          git push
