name: V3 Refresh IDX daily data

on:
  workflow_dispatch:
  schedule:
    # 19:30 and 22:30 WIB weekdays; gives Yahoo time to finalize the IDX daily candle.
    - cron: "30 12,15 * * 1-5"

permissions:
  contents: write

concurrency:
  group: v3-market-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh all daily candles into one market file
        run: python scripts/update_market_v3.py --mode daily --workers 6
      - name: Commit market.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then
            echo "No daily market changes."
            exit 0
          fi
          git commit -m "chore(v3): refresh IDX daily market data"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
