name: V3 Refresh IDX 5-minute data

on:
  workflow_dispatch:
  schedule:
    # Target every 5 minutes on weekdays. GitHub scheduled jobs can still be queued/delayed.
    - cron: "*/5 1-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: v3-market-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh all 5-minute candles into one market file
        run: python scripts/update_market_v3.py --mode intraday --workers 6
      - name: Commit market.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          if git diff --cached --quiet; then
            echo "No intraday market changes."
            exit 0
          fi
          git commit -m "chore(v3): refresh IDX 5-minute market data"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
