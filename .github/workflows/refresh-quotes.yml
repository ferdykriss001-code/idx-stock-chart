name: V3 Full IDX - Refresh 5-minute quotes

on:
  workflow_dispatch:
  schedule:
    # Weekdays, every 5 minutes. GitHub may queue scheduled jobs.
    - cron: "*/5 1-10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: full-idx-quotes-writer
  cancel-in-progress: false

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh shard ${{ matrix.shard }}
        run: |
          python scripts/update_quotes_full.py \
            --shard-index ${{ matrix.shard }} \
            --shard-count 8 \
            --batch-size 30 \
            --fallback-limit 8 \
            --out build/quotes-shard-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: quotes-shard-${{ matrix.shard }}
          path: build/quotes-shard-${{ matrix.shard }}.json
          retention-days: 1

  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: quotes-shard-*
          path: build/shards
          merge-multiple: true
      - name: Merge fresh shards with previous cache
        run: python scripts/merge_quote_shards.py --input-dir build/shards
      - name: Commit quotes.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          if git diff --cached --quiet; then
            echo "No quote changes."
            exit 0
          fi
          git commit -m "chore(full-idx): refresh 5-minute quotes in parallel"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          exit 1
